name: Обновить данные из Торгстат

on:
  schedule:
    - cron: '30 3 * * *'   # каждый день в 06:30 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Выгрузить данные
        env:
          TORGSTAT_SESSION: ${{ secrets.TORGSTAT_SESSION }}
        run: node update.mjs

      - name: Данные из API WB и Ozon
        continue-on-error: true
        env:
          WB_SAKOVSKY_TOKEN: ${{ secrets.WB_SAKOVSKY_TOKEN }}
          WB_DARMIL_TOKEN: ${{ secrets.WB_DARMIL_TOKEN }}
          OZON_SAKOVSKY_CLIENT_ID: ${{ secrets.OZON_SAKOVSKY_CLIENT_ID }}
          OZON_SAKOVSKY_API_KEY: ${{ secrets.OZON_SAKOVSKY_API_KEY }}
          OZON_SUAVISS_CLIENT_ID: ${{ secrets.OZON_SUAVISS_CLIENT_ID }}
          OZON_SUAVISS_API_KEY: ${{ secrets.OZON_SUAVISS_API_KEY }}
        run: node api.mjs

      - name: Закоммитить данные
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json market.json 2>/dev/null || git add data.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Данные на $(TZ=Europe/Moscow date +%d.%m.%Y)"
            git pull --rebase --autostash && git push
          fi
