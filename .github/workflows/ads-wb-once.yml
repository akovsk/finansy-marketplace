name: Разовое исправление кампаний WB

# Запускается, когда меняется .github/wb-once.json (какую кампанию-дубль завершить и какую оставить)
on:
  push:
    branches: [main]
    paths: ['.github/wb-once.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-agent
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Завершить дубль
        env:
          WB_SAKOVSKY_TOKEN: ${{ secrets.WB_SAKOVSKY_TOKEN }}
          WB_DARMIL_TOKEN: ${{ secrets.WB_DARMIL_TOKEN }}
        run: node ads-wb-once.mjs

      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add ads-agent.json .github/wb-once.result.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Агент рекламы: разовое исправление WB $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
            git pull --rebase -X theirs --autostash && git push
          fi
