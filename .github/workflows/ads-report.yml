name: Отчёт агента рекламы в Telegram

on:
  schedule:
    # каждый вечер в 21:00 по Москве: всё, что агент сделал за день, со скриншотами
    - cron: '0 18 * * *'
  workflow_dispatch:
  # сразу после запуска агента кнопкой «показать сейчас» (.github/run-now)
  workflow_run:
    workflows: ['ИИ-агенты рекламы WB и Ozon']
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежий ads-agent.json, который агент только что сохранил

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Браузер для скриншотов
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Отчёт в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.WBBOT1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TETRIPAS134BOT }}
        run: node ads-report.mjs
