name: ИИ-агенты рекламы WB и Ozon

on:
  schedule:
    # дважды в день: 06:17 и 15:17 по Москве (после свежей выгрузки данных)
    - cron: '17 3,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: config — как в ads-agent.config.json, dry-run — только план, live — менять кампании'
        type: choice
        default: config
        options: [config, dry-run, live]
  # «Показать сейчас»: изменение файла .github/run-now запускает агента в режиме проверки,
  # а следом отчёт с планом уходит в Telegram (workflow «Отчёт агента рекламы в Telegram»)
  push:
    branches: [main]
    paths: ['.github/run-now']

permissions:
  contents: write

concurrency:
  group: ads-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Проверка логики агента
        run: node ads-agent.test.mjs

      - name: Агент - решения по кампаниям
        env:
          ADS_AGENT_MODE: ${{ github.event_name == 'push' && 'dry-run' || (inputs.mode != 'config' && inputs.mode || '') }}
          WB_SAKOVSKY_TOKEN: ${{ secrets.WB_SAKOVSKY_TOKEN }}
          WB_DARMIL_TOKEN: ${{ secrets.WB_DARMIL_TOKEN }}
          OZON_PERF_SAKOVSKY_CLIENT_ID: ${{ secrets.OZON_PERF_SAKOVSKY_CLIENT_ID }}
          OZON_PERF_SAKOVSKY_CLIENT_SECRET: ${{ secrets.OZON_PERF_SAKOVSKY_CLIENT_SECRET }}
          OZON_PERF_SUAVISS_CLIENT_ID: ${{ secrets.OZON_PERF_SUAVISS_CLIENT_ID }}
          OZON_PERF_SUAVISS_CLIENT_SECRET: ${{ secrets.OZON_PERF_SUAVISS_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.WBBOT1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TETRIPAS134BOT }}
        run: node ads-agent.mjs

      - name: Сохранить решения
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add ads-agent.json ads-memory.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Агент рекламы: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
            git pull --rebase -X theirs --autostash && git push
          fi
